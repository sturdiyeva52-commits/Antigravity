<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="mintTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="50%" stop-color="#115E59" />
      <stop offset="100%" stop-color="#134E4A" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="900" fill="url(#mintTeal)" />

  <!-- 3D Spine Crease -->
  <rect x="0" y="0" width="28" height="900" fill="#000000" opacity="0.35" />
  <rect x="28" y="0" width="4" height="900" fill="#FFFFFF" opacity="0.08" />

  <!-- Decorative Frame -->
  <rect x="40" y="40" width="520" height="820" rx="10" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="52" y="52" width="496" height="796" rx="8" fill="none" stroke="#2DD4BF" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.3" />

  <!-- Peaceful Sunlight Botanical Arc -->
  <circle cx="300" cy="460" r="140" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-opacity="0.25" />
  <circle cx="300" cy="460" r="110" fill="none" stroke="url(#goldText)" stroke-width="1.5" />
  
  <!-- Stylized Lotus / Olive Leaf Centerpiece -->
  <g transform="translate(300, 460) scale(1.3)" fill="url(#goldText)">
    <path d="M0,-40 C15,-20 20,0 0,30 C-20,0 -15,-20 0,-40 Z" />
    <path d="M-5,-10 C-30,-20 -35,5 -10,20 C-5,10 -5,0 -5,-10 Z" opacity="0.8" />
    <path d="M5,-10 C30,-20 35,5 10,20 C5,10 5,0 5,-10 Z" opacity="0.8" />
  </g>

  <!-- Author -->
  <text x="300" y="160" font-family="'Merriweather', Georgia, serif" font-size="22" font-weight="700" letter-spacing="2" fill="#CCFBF1" text-anchor="middle">
    DOKTOR OIZ AL-QARNIY
  </text>
  <line x1="200" y1="180" x2="400" y2="180" stroke="url(#goldText)" stroke-width="1.5" />

  <!-- Title -->
  <text x="300" y="270" font-family="'Merriweather', Georgia, serif" font-size="40" font-weight="900" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">
    RUHIY
  </text>
  <text x="300" y="325" font-family="'Merriweather', Georgia, serif" font-size="34" font-weight="900" letter-spacing="2" fill="url(#goldText)" text-anchor="middle">
    XOTIRJAMLIK SARI
  </text>

  <text x="300" y="670" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="500" font-style="italic" fill="#CCFBF1" text-anchor="middle">
    "G'am-qayg'udan xalos bo'lish va xotirjam yashash yo'li"
  </text>

  <!-- Publisher Footer -->
  <text x="300" y="810" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="3" fill="url(#goldText)" text-anchor="middle">
    HILOL NASHR
  </text>
</svg>
