<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="50%" stop-color="#0C1D36" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="goldHues" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="900" fill="url(#nightSky)" />

  <!-- 3D Spine Crease -->
  <rect x="0" y="0" width="28" height="900" fill="#000000" opacity="0.4" />
  <rect x="28" y="0" width="4" height="900" fill="#FFFFFF" opacity="0.08" />

  <!-- Stars -->
  <g fill="#FDE68A" opacity="0.8">
    <circle cx="100" cy="80" r="1.5" />
    <circle cx="140" cy="180" r="2" />
    <circle cx="210" cy="90" r="1" />
    <circle cx="480" cy="110" r="2.5" />
    <circle cx="520" cy="220" r="1.5" />
    <circle cx="380" cy="140" r="2" />
    <circle cx="440" cy="290" r="1" />
    <circle cx="80" cy="340" r="1.5" />
    <circle cx="510" cy="420" r="2" />
    <circle cx="160" cy="460" r="1.5" />
  </g>

  <!-- Crescent Moon -->
  <path d="M470,80 A35,35 0 1 0 495,135 A40,40 0 1 1 470,80 Z" fill="url(#goldHues)" opacity="0.85" />

  <!-- Author -->
  <text x="300" y="160" font-family="'Merriweather', Georgia, serif" font-size="22" font-weight="700" letter-spacing="3" fill="#E2E8F0" text-anchor="middle">
    PIRIMQUL QODIROV
  </text>
  <line x1="200" y1="180" x2="400" y2="180" stroke="url(#goldHues)" stroke-width="1.5" />

  <!-- Title -->
  <text x="300" y="270" font-family="'Merriweather', Georgia, serif" font-size="46" font-weight="900" letter-spacing="2" fill="url(#goldHues)" text-anchor="middle">
    YULDUZLI
  </text>
  <text x="300" y="325" font-family="'Merriweather', Georgia, serif" font-size="46" font-weight="900" letter-spacing="4" fill="#FFFFFF" text-anchor="middle">
    TUNLAR
  </text>

  <text x="300" y="375" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="2" fill="#94A3B8" text-anchor="middle">
    BOBUR TARIXIY ROMANI
  </text>

  <!-- Samarkand Oriental Dome & Minarets Silhouette -->
  <path d="M40,750 L120,750 L120,580 L135,560 L135,500 L125,480 L125,750 L200,750 L200,620 C200,560 260,520 300,500 C340,520 400,560 400,620 L400,750 L460,750 L460,480 L450,500 L450,560 L465,580 L465,750 L560,750 L560,900 L40,900 Z" fill="#050C16" />
  <!-- Dome glow accent -->
  <path d="M220,630 C220,580 270,545 300,530 C330,545 380,580 380,630 Z" fill="url(#goldHues)" opacity="0.25" />

  <!-- Publisher Footer -->
  <text x="300" y="830" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="3" fill="url(#goldHues)" text-anchor="middle">
    YANGI ASR AVLODI
  </text>
</svg>
